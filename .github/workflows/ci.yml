name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  analyze-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android (debug)
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: Build iOS (unsigned)
    needs: analyze-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter build ios --release --no-codesign
      # The lock screen progress is drawn by an app extension; without it in
      # the app the Dynamic Island shows an empty pill.
      - name: Check the Live Activity extension is embedded
        run: |
          APP=build/ios/iphoneos/Runner.app
          APPEX="$APP/PlugIns/JobActivityWidget.appex"
          ls -l "$APP/PlugIns"
          test -x "$APPEX/JobActivityWidget"
          plutil -p "$APPEX/Info.plist"
          plutil -extract NSExtension.NSExtensionPointIdentifier raw "$APPEX/Info.plist" | grep -qx com.apple.widgetkit-extension
          plutil -extract NSSupportsLiveActivities raw "$APP/Info.plist" | grep -qx true
          test "$(plutil -extract CFBundleVersion raw "$APPEX/Info.plist")" = "$(plutil -extract CFBundleVersion raw "$APP/Info.plist")"
          strings "$APPEX/JobActivityWidget" | grep -q JobActivityAttributes
          strings "$APP/Runner" | grep -q JobActivityAttributes
          # The home screen widgets are in the same extension.
          strings "$APPEX/JobActivityWidget" | grep -q SelectServerIntent
          strings "$APPEX/JobActivityWidget" | grep -q StatusWidgetView
