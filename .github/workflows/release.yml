name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Build APK and AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; release APKs use a throw-away debug key and cannot update an installed app. See tools/make-android-keystore.sh."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          PROPS
      - name: Build
        run: |
          VERSION="${TAG#v}"
          ARGS="--release --build-name=${VERSION%%-*} --build-number=${{ github.run_number }}"
          mkdir -p dist
          flutter build apk $ARGS
          cp build/app/outputs/flutter-apk/app-release.apk dist/
          flutter build apk --split-per-abi $ARGS
          cp build/app/outputs/flutter-apk/app-*-release.apk dist/
          flutter build appbundle $ARGS
          cp build/app/outputs/bundle/release/app-release.aab dist/
          # The app's updater finds its APK by these names (ReleaseInfo.apkFor).
          for f in dist/*; do mv "$f" "dist/truenas-mobile-$TAG-${f#dist/app-}"; done
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  ios:
    name: Build IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          VERSION="${TAG#v}"
          flutter build ios --release --no-codesign \
            --build-name=${VERSION%%-*} --build-number=${{ github.run_number }}
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/truenas-mobile-$TAG-unsigned.ipa" Payload
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
