name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.7"
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  android:
    name: Build APKs and Play AAB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No signing secrets set; release APKs use a throw-away debug key and cannot update an installed app. See tools/make-android-keystore.sh."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storeFile=upload-keystore.jks
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          storePassword=$STORE_PASSWORD
          PROPS
      - name: Build
        run: |
          VERSION="${TAG#v}"
          ARGS="--release --build-name=${VERSION%%-*} --build-number=${{ github.run_number }}"
          mkdir -p dist
          # GitHub build: self-updating APKs.
          flutter build apk $ARGS --flavor github
          cp build/app/outputs/flutter-apk/app-github-release.apk dist/
          flutter build apk --split-per-abi $ARGS --flavor github
          cp build/app/outputs/flutter-apk/app-github-*-release.apk dist/
          tools/check-play-manifest.sh github Release
          # The app's updater finds its APK by these names (ReleaseInfo.apkFor).
          for f in dist/app-github-*.apk; do mv "$f" "dist/truenas-mobile-$TAG-${f#dist/app-github-}"; done
          # Google Play build: no updater, no REQUEST_INSTALL_PACKAGES. Signed
          # with the same key, which Play takes as the upload key.
          flutter build appbundle $ARGS --flavor play
          tools/check-play-manifest.sh play Release
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "dist/truenas-mobile-$TAG-play.aab"
          ls -l dist
      - name: Show the key the Play bundle is signed with
        run: |
          AAB="dist/truenas-mobile-$TAG-play.aab"
          CERT="$(keytool -printcert -jarfile "$AAB")"
          echo "$CERT"
          {
            echo "### Play bundle signing certificate"
            echo '```'
            echo "$CERT" | grep -E "Owner|SHA1|SHA256"
            echo '```'
            echo "Play Console > App integrity must list this SHA-256 as the upload key."
          } >> "$GITHUB_STEP_SUMMARY"
          if echo "$CERT" | grep -q "Android Debug"; then
            echo "::warning::The Play bundle is signed with a debug key and Play will refuse it. Set the ANDROID_* signing secrets."
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/*

  ios:
    name: Build IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build
        run: |
          VERSION="${TAG#v}"
          flutter build ios --release --no-codesign \
            --build-name=${VERSION%%-*} --build-number=${{ github.run_number }}
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/truenas-mobile-$TAG-unsigned.ipa" Payload
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/*.ipa

  publish:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          generate_release_notes: true
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
